[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Agenda de cada gestor pro Google Agenda (assinatura por URL).
[[redirects]]
  from = "/agenda/:token"
  to = "/.netlify/functions/agenda-ics"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"
